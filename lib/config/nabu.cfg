#
# Target configuration file for z88dk, when building for the NABU computer.
#

INCLUDE tools.inc

# Asm file which contains the startup code (without suffix)
CRT0	DESTDIR/lib/target/nabu/classic/nabu_crt0

# Any default options you want - these are options to zcc which are fed
# through to compiler, assembler etc. as necessary.  Though -D doesn't go to
# the assembler, need to use -pragma-define: for defc assembler constants.
OPTIONS	-O2 -SO2 -iquote. -D__Z80__ -D__Z80 -D__NABU__ -D__NABUPC__ -Cc-standard-escape-chars -subtype=default -pragma-define:__CPU_CLOCK=3579545

# The nabu_bare subtype has NO libraries, no standard IO, nothing.  So you can
# do everything yourself (or add the NABU_LIB files to your code) to save RAM.
# See https://github.com/DJSures/NABU-LIB for that project.
SUBTYPE	default	-startup=0 -Cz+newext -Cz-e -Cz.nabu -clib=default
SUBTYPE	bare	-startup=0 -Cz+newext -Cz-e -Cz.nabu -clib=bare -pragma-define:CRT_ENABLE_STDIO=0 -pragma-define:NABU_BARE_ASM=1 -D__NABU_BARE__

CLIB	default	-lnabu_clib -lnabu_int -lndos -LDESTDIR/lib/clibs/z80
CLIB	ansi	-pragma-need=ansiterminal -D__CONIO_VT100 -lnabu_clib -lnabu_int -lndos -LDESTDIR/lib/clibs/z80
CLIB	bare	-LDESTDIR/lib/clibs/z80

INCLUDE	alias.inc

